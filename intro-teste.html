<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TRIBYTE — Teste da abertura 3D</title>
  <link rel="icon" href="assets/logo-tribyte-mark.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="intro-teste.css" />
  <script src="assets/gsap-3.12.5.min.js" defer></script>
  <script src="intro.js" defer></script>
  <script src="intro-teste.js" defer></script>
</head>
<body>
  <div class="lab-bar">
    <strong>Modelo de teste</strong>
    <button type="button" id="replay">Repetir abertura</button>
    <label>Camadas <input id="layers" type="range" min="8" max="56" value="36" /></label>
    <label>Profundidade <input id="depth" type="range" min="10" max="120" value="46" /></label>
    <label>Velocidade <input id="speed" type="range" min="0.5" max="2" step="0.1" value="1" /></label>
  </div>
  <main class="lab">
    <section class="pane" aria-label="Modelo da abertura">
      <span>Modelo ajustável</span>
      <div id="model"></div>
    </section>
    <section class="pane" aria-label="Abertura no site real">
      <div class="site-preview">
        <a class="button button-secondary" href="index.html?intro" target="_blank" rel="noopener">Ver abertura no site em nova aba</a>
      </div>
    </section>
  </main>
</body>
</html>
